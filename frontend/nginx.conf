server {
    listen       ${PORT};
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Health của riêng frontend — trả lời tại nginx, KHÔNG proxy sang backend.
    # Nếu để Render check frontend ở /api/v1/health/, mỗi 10s sẽ là một request
    # máy-móc-đến-máy sang host backend (sau Cloudflare) → 429 "Just a moment"
    # và frontend bị đánh giá unhealthy chỉ vì backend chậm.
    # Health Check Path của frontend nên đặt là "/" hoặc "/api/v1/health/".
    location = /api/v1/health/ {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Proxy API → Django backend (Render hoặc docker-compose)
    # Bundle luôn gọi relative /api/v1 → đi qua đây (không bao giờ gọi thẳng host backend)
    # ^~ để location regex cache ảnh bên dưới không cướp mất request /api/
    location ^~ /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        # UA thật: "nginx/x.y.z" là dấu hiệu bot rõ nhất, dễ bị Cloudflare challenge
        proxy_set_header   User-Agent        PhoneStore-frontend-proxy/1.0;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Pass-through proto gốc (Render gửi https) — nếu gửi $scheme=http thì
        # Django sinh URL ảnh http:// → browser chặn mixed content, ảnh vỡ
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Ảnh upload (ProductImage) — Django serve /media/, đi qua cùng origin để giữ HTTPS
    # ^~ là bắt buộc: nếu không, location regex \.(jpg|png...)$ bên dưới khớp trước
    # và nginx sẽ tìm file trong /usr/share/nginx/html → 404 toàn bộ ảnh upload
    location ^~ /media/ {
        proxy_pass          ${BACKEND_URL};
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
        expires             7d;
        add_header          Cache-Control "public";
    }

    # SPA — mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
