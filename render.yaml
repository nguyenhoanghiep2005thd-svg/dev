# render.yaml — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── Backend — Django + Gunicorn ─────────────────────────────
  - type: web
    name: phonestore-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/products/
    startCommand: "sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120'"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://phonestore-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: phonestore-db
          property: connectionString

  # ── Frontend — React + Nginx ─────────────────────────────────
  - type: web
    name: phonestore-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: "https://phonestore-backend.onrender.com"

# ── Database — PostgreSQL ────────────────────────────────────
databases:
  - name: phonestore-db
    plan: free
    region: singapore
    databaseName: phonestore_db
    user: phonestore_user
