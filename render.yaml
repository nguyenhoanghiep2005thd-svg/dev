# render.yaml — Render Blueprint
# Database: Neon PostgreSQL (external)

services:

  # ── Backend — Django + Gunicorn ─────────────────────────────
  - type: web
    name: phonestore-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/products/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # DATABASE_URL — set thủ công từ Neon connection string
      - key: DATABASE_URL
        sync: false   # không sync từ database service — user tự điền

  # ── Frontend — React + Nginx ─────────────────────────────────
  - type: web
    name: phonestore-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: "https://phonestore-backend.onrender.com"
