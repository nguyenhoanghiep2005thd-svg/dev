# render.yaml — Render Blueprint cho PhoneStore
# Hệ thống gồm 2 web services: backend (Django) + frontend (React + Nginx)

services:

  # ── Backend — Django + Gunicorn ─────────────────────────────
  - type: web
    name: phonestore-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false   # Dán link Neon / Render PostgreSQL vào đây
      - key: FRONTEND_URL
        fromService:
          type: web
          name: phonestore-frontend
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com"

  # ── Frontend — React + Nginx ─────────────────────────────────
  - type: web
    name: phonestore-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: phonestore-backend
          property: host
