# render.yaml — Render Blueprint
# Database: Neon PostgreSQL (external)

services:

  # ── Backend — Django + Gunicorn ─────────────────────────────
  - type: web
    name: phonestore-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    # Migrate + seed chạy ở instance riêng TRƯỚC khi web start.
    # Nếu để trong CMD, chỉ cần DB lỗi là gunicorn không bao giờ boot → Render 502 vĩnh viễn.
    preDeployCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_data"
    # /api/v1/health/ không chạm DB → không bao giờ báo sai service chết
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # DATABASE_URL — Neon connection string (bắt buộc, nếu thiếu sẽ 500/502)
      - key: DATABASE_URL
        sync: false   # không sync từ database service — user tự điền
      # URL frontend thật (CORS + CSRF admin) — PHẢI khớp tên service đã tạo trên dashboard
      - key: FRONTEND_URL
        value: "https://phonestore-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://phonestore-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://phonestore-frontend.onrender.com"

  # ── Frontend — React + Nginx ─────────────────────────────────
  - type: web
    name: phonestore-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      # Để trống → bundle dùng relative /api/v1 → nginx proxy (tránh CORS)
      - key: VITE_API_URL
        value: ""
      # Runtime: nginx proxy /api/ → backend Render
      # Tên thật của service backend (xem Render → backend → External URL)
      - key: BACKEND_URL
        value: "https://phonestore-backend-oiip.onrender.com"
